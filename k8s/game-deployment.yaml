---
# Namespace for Thirsty's Game Studio
apiVersion: v1
kind: Namespace
metadata:
  name: thirsty-game-studio
  labels:
    app.kubernetes.io/name: thirsty-game-studio
    app.kubernetes.io/part-of: gaming-platform
---
# ConfigMap for Game Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: game-config
  namespace: thirsty-game-studio
data:
  SDL_VIDEODRIVER: "dummy"
  SDL_AUDIODRIVER: "dummy"
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"
---
# PersistentVolumeClaim for Game Saves
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: game-saves-pvc
  namespace: thirsty-game-studio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
# Deployment for Game Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: thirsty-game-studio
  labels:
    app: game-server
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-server
  template:
    metadata:
      labels:
        app: game-server
        version: v1.0.0
    spec:
      containers:
      - name: game
        image: ghcr.io/iamsothirsty/thirsty-game:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: game-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: saves
          mountPath: /app/saves
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import app; print('healthy')"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import app; print('ready')"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: saves
        persistentVolumeClaim:
          claimName: game-saves-pvc
      restartPolicy: Always
---
# Service for Game Server
apiVersion: v1
kind: Service
metadata:
  name: game-server-service
  namespace: thirsty-game-studio
  labels:
    app: game-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: game-server
---
# HorizontalPodAutoscaler for Game Server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-server-hpa
  namespace: thirsty-game-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
