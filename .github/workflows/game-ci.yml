name: Game CI/CD Pipeline

on:
  push:
    branches: [ main, copilot/** ]
    paths:
      - 'app/**'
      - 'tests/test_*.py'
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile.game'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/test_*.py'
      - 'main.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  test-game:
    name: Test Game
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run game tests
        run: |
          pytest tests/test_engine.py tests/test_components.py tests/test_systems.py tests/test_save_system.py tests/test_survival_shooter.py -v --cov=app --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: game
          name: game-coverage
          fail_ci_if_error: false

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-game
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/thirsty-game
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.game
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test-game
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: test-game
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark
      
      - name: Run performance tests
        run: |
          timeout 30 python main.py --headless || true
          echo "Performance test completed"
      
      - name: Check memory usage
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.game import ThirstysGame
          game = ThirstysGame(headless=True)
          import tracemalloc
          tracemalloc.start()
          
          # Simulate some gameplay
          game.engine.start()
          for _ in range(100):
              game.engine.update()
          
          current, peak = tracemalloc.get_traced_memory()
          print(f'Current memory usage: {current / 1024 / 1024:.1f} MB')
          print(f'Peak memory usage: {peak / 1024 / 1024:.1f} MB')
          tracemalloc.stop()
          
          # Assert reasonable memory usage (< 100MB)
          assert peak < 100 * 1024 * 1024, f'Memory usage too high: {peak / 1024 / 1024:.1f} MB'
          "

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy notification
        run: |
          echo "🚀 Deploying Thirsty's Game to production..."
          echo "Docker image: ghcr.io/${{ github.repository_owner }}/thirsty-game:latest"
          echo ""
          echo "Deployment methods available:"
          echo "  - Docker Compose: docker-compose --profile game up -d"
          echo "  - Kubernetes: kubectl apply -f k8s/"
          echo "  - Make: make deploy-game"
